<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OGraf Template Editor</title>
    <link rel="stylesheet" href="src/styles/main.css">
    <link rel="stylesheet" href="src/styles/components.css">
    <link rel="stylesheet" href="src/styles/timeline.css">
</head>
<body>
    <div id="app">
        <header class="header">
            <div class="header-content">
                <h1>OGraf Template Editor</h1>
                <div class="header-actions">
                    <button id="new-template" class="btn btn-primary">New Template</button>
                    <button id="import-template" class="btn btn-secondary">Import</button>
                    <button id="export-template" class="btn btn-secondary">Export</button>
                </div>
            </div>
        </header>

        <main class="main-content">
            <aside class="sidebar">
                <div class="panel template-list">
                    <h3>Templates</h3>
                    <div id="template-list" class="template-list-content">
                        <div class="empty-state">
                            <p>No templates created yet</p>
                            <button id="create-first-template" class="btn btn-primary">Create Your First Template</button>
                        </div>
                    </div>
                </div>

                <div class="panel-resizer" role="separator" aria-orientation="horizontal" aria-label="Resize templates panel" tabindex="0"></div>

                <div class="panel properties-panel">
                    <h3>Properties</h3>
                    <div id="properties-content" class="properties-content">
                        <div class="empty-state">
                            <p>Select an element to edit properties</p>
                        </div>
                    </div>
                </div>
            </aside>

            <div class="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="Resize sidebar" tabindex="0"></div>

            <section class="editor-area">
                <div class="editor-tabs">
                    <button class="tab-btn active" data-tab="visual">Visual Editor</button>
                    <button class="tab-btn" data-tab="code">Code Editor</button>
                    <button class="tab-btn" data-tab="preview">Preview</button>
                </div>

                <div class="editor-content">
                    <div id="visual-editor" class="editor-tab active">
                        <div class="element-toolbar">
                            <button class="tool-btn" data-element="text" title="Add Text" aria-label="Add Text">
                                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M5 6h14" />
                                    <path d="M12 6v12" />
                                </svg>
                            </button>
                            <button class="tool-btn" data-element="image" title="Add Image" aria-label="Add Image">
                                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <rect x="4" y="4" width="16" height="16" rx="2" />
                                    <circle cx="9" cy="9" r="1.6" />
                                    <path d="M20 15l-4.5-4.5L6 20" />
                                </svg>
                            </button>
                            <button class="tool-btn" data-element="rect" title="Add Rectangle" aria-label="Add Rectangle">
                                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <rect x="4" y="6" width="16" height="12" rx="1.5" />
                                </svg>
                            </button>
                            <button class="tool-btn" data-element="circle" title="Add Circle" aria-label="Add Circle">
                                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <circle cx="12" cy="12" r="8" />
                                </svg>
                            </button>

                            <div class="canvas-zoom-controls">
                                <button class="tool-btn" data-canvas-action="fit" title="Zoom to fit elements" aria-label="Zoom to fit all elements">
                                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                        <path d="M4 9V5a1 1 0 0 1 1-1h4" />
                                        <path d="M15 4h4a1 1 0 0 1 1 1v4" />
                                        <path d="M20 15v4a1 1 0 0 1-1 1h-4" />
                                        <path d="M9 20H5a1 1 0 0 1-1-1v-4" />
                                    </svg>
                                </button>
                                <button class="tool-btn" data-canvas-action="fit-canvas" title="Fit whole canvas in view" aria-label="Fit the whole canvas in view">
                                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                        <rect x="3" y="5" width="18" height="14" rx="1.5" />
                                        <path d="M7 9l-2 1.5L7 12" />
                                        <path d="M17 9l2 1.5L17 12" />
                                    </svg>
                                </button>
                                <button class="tool-btn" data-canvas-action="reset" title="Reset zoom to 100%" aria-label="Reset zoom to 100 percent">
                                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                        <path d="M21 12a9 9 0 1 1-3-6.7" />
                                        <path d="M21 3v4h-4" />
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <div class="canvas-container">
                            <div id="graphics-canvas" class="graphics-canvas">
                                <div class="canvas-placeholder">
                                    <p>Select a template or create a new one to start editing</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div id="code-editor" class="editor-tab">
                        <div class="code-editor-container">
                            <div id="monaco-editor"></div>
                        </div>
                    </div>

                    <div id="preview-editor" class="editor-tab">
                        <div class="preview-container">
                            <div class="preview-controls">
                                <button id="play-preview" class="btn btn-primary">Play</button>
                                <button id="stop-preview" class="btn btn-secondary">Stop</button>
                            </div>
                            <div id="preview-frame" class="preview-frame">
                                <div class="preview-placeholder">
                                    <p>Preview will appear here</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div id="template-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Create New Template</h2>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <form id="template-form">
                    <div class="form-group">
                        <label for="template-id">Template ID:</label>
                        <input type="text" id="template-id" name="id" required>
                    </div>
                    <div class="form-group">
                        <label for="template-name">Name:</label>
                        <input type="text" id="template-name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="template-description">Description:</label>
                        <textarea id="template-description" name="description"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="template-type">Template Type:</label>
                        <select id="template-type" name="type">
                            <option value="lower-third">Lower Third</option>
                            <option value="title">Title Card</option>
                            <option value="bug">Station Bug</option>
                            <option value="custom">Custom</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="cancel-template">Cancel</button>
                <button type="button" class="btn btn-primary" id="create-template">Create</button>
            </div>
        </div>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
